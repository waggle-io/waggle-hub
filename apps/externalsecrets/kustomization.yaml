apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Requires `kustomize.buildOptions: --enable-helm` in argocd-cm.

resources:
- namespace.yaml
- clustersecretstore.yaml

helmCharts:
- name: external-secrets
  repo: https://charts.external-secrets.io
  version: 2.12.0
  releaseName: external-secrets
  namespace: external-secrets
  includeCRDs: true
  valuesInline:
    installCRDs: true
    serviceAccount:
      annotations:
        # IRSA role from deploy/eks/secrets.tf (`terraform output external_secrets_role_arn`)
        eks.amazonaws.com/role-arn: arn:aws:iam::514314268914:role/waggle-hub-external-secrets
