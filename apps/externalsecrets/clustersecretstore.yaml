# Hub-wide store for the Secrets Manager secrets created by deploy/eks/secrets.tf.
# No `auth` block: the controller authenticates with its own IRSA role,
# which can read only secrets under the `waggle/` prefix.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    # After the chart's CRDs and webhook (wave 0) are healthy
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
  # Only spoke-cluster namespaces may use this store. The waggle-clusters
  # ApplicationSet labels every namespace it creates; without this, any
  # namespace on the hub could read the cloud credentials and pull secret.
  conditions:
  - namespaceSelector:
      matchLabels:
        waggle.io/cluster-namespace: "true"
