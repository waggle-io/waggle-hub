apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Requires `kustomize.buildOptions: --enable-helm` in argocd-cm.
# No top-level `namespace:` on purpose: the chart puts its leader-election
# Role/RoleBinding in kube-system and that must not be rewritten.

resources:
- namespace.yaml

helmCharts:
- name: cert-manager
  repo: https://charts.jetstack.io
  version: v1.21.2
  releaseName: cert-manager
  namespace: cert-manager
  valuesInline:
    crds:
      enabled: true
      keep: true
