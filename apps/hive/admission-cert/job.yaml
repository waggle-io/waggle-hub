# Issues the initial cert on every sync (no-op if the current one is still valid).
apiVersion: batch/v1
kind: Job
metadata:
  name: hiveadmission-cert-issue
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: hiveadmission-cert-issuer
      restartPolicy: OnFailure
      containers:
      - name: issue-cert
        image: alpine/k8s:1.34.12
        command: ["/bin/sh", "/scripts/issue-cert.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: hiveadmission-cert-script
