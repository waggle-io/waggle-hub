apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-aws

resources:
- externalsecrets.yaml
- clusterdeployment.yaml
- machinepool.yaml

secretGenerator:
- name: demo-aws-install-config
  files:
  - install-config.yaml

generatorOptions:
  # The ClusterDeployment references the Secret by this exact name
  disableNameSuffixHash: true
