# Credentials synced from AWS Secrets Manager. Requires a ClusterSecretStore
# named aws-secrets-manager (not yet created on the hub; see README roadmap).
#
# Delete=false: when clusters/demo-aws/ is deleted, Argo CD deletes the
# ClusterDeployment and Hive deprovisions using these credentials. They must
# outlive the ClusterDeployment, so Argo CD leaves them in place. Clean up
# the namespace after deprovisioning finishes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-aws-aws-creds
  namespace: demo-aws
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: demo-aws-aws-creds
    deletionPolicy: Retain
  data:
  - secretKey: aws_access_key_id
    remoteRef:
      key: waggle/aws/target-account
      property: aws_access_key_id
  - secretKey: aws_secret_access_key
    remoteRef:
      key: waggle/aws/target-account
      property: aws_secret_access_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-aws-pull-secret
  namespace: demo-aws
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: demo-aws-pull-secret
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
  - secretKey: .dockerconfigjson
    remoteRef:
      key: waggle/redhat/pull-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-aws-ssh-key
  namespace: demo-aws
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: demo-aws-ssh-key
    deletionPolicy: Retain
  data:
  - secretKey: ssh-privatekey
    remoteRef:
      key: waggle/ssh/hive
      property: ssh-privatekey
  - secretKey: ssh-publickey
    remoteRef:
      key: waggle/ssh/hive
      property: ssh-publickey
