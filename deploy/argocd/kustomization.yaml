apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD for the EKS hub. Bootstrap once by hand (CRDs are too large for
# client-side apply):
#   kubectl apply -k deploy/argocd --server-side
# After that, gitops/argocd/argocd.yaml lets Argo CD manage itself.
# To upgrade, bump the version in the install.yaml URL.

namespace: argocd

resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/install.yaml
- ingress.yaml

patches:
- path: argocd-cm.yaml
- path: argocd-cmd-params-cm.yaml
