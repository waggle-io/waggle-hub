# Argo CD manages its own install after the one-time bootstrap.
# Prune stays off: a bad commit must not be able to delete Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/waggle-io/waggle-hub
    targetRevision: main
    path: deploy/argocd
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
