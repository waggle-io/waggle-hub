---
# Root "app of apps". Apply this once by hand:
#   kubectl apply -f apps/rootapp.yaml
# ArgoCD then syncs every Application under apps/applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rootapp
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/waggle-io/waggle-hub
    targetRevision: main
    path: gitops/
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
